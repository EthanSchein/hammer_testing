# Configuration options and defaults for Innovus.
# The values specified in this file are the defaults.

par.innovus:
  # Emit the Innovus Python API instead of Tcl. The Python engine requires the
  # INVS200 (AI) license -- with only the INVS100 base license, innovus refuses
  # to run the generated par.py (IMPLIC-90). Tcl works on any license, so it is
  # the default. Setting this true also needs version 25.1 or newer.
  use_python: false

  # Location of the binary.
  innovus_bin: "${cadence.cadence_home}/DDI/DDI${par.innovus.version}/bin/innovus"
  innovus_bin_meta: lazysubst # we want later overrides to be able to affect this

  # Innovus version to use.
  # Used to locate the binary - e.g. the '221' in ${cadence.cadence_home}/DDI/DDI221/INNOVUS221/bin/innovus
  version: "231"

  # Design flow effort.
  # Valid options: express (fastest), standard, and extreme (slowest).
  design_flow_effort: "standard"

  # Design power effort.
  # Valid options: none, low, high.
  design_power_effort: "low"

  # Floorplanning SDC constraints to use.
  # Valid options are:
  # - blank - Specify no floorplanning constraints (likely won't work)
  # - manual - Specify the contents of a manual SDC floorplanning script to use in floorplan_script_contents.
  # - generate - Generate a floorplan from the hammer-vlsi config/IR.
  # - auto - Use Innovus's `plan_design` command to auto-generate a floorplan. Will have poor, but sane results
  #   If you specify this, you must also specify the floorplanning_script config below. The floorplanning_script config will be ignored in other modes.
  # TODO(edwardw): Put in new floorplanning thing here when done.
  floorplan_mode: generate
  floorplan_script_contents: null

  # Use "clock concurrent optimization" in clock tree synthesis.
  # If true, uses the ccopt_design command which includes this feature
  # by default in Innovus Common UI.
  # Note that this requires an optional licence (enccco).
  # type: bool
  use_cco: true

  # Route bumps with early global router (version >= 23.1 only).
  # By default, bumps are ignored for routing. If true, turn on early bump routing.
  # This is useful for RC delay estimation if you don't have IO cells routed to bumps via the flip-chip router.
  early_route_bumps: false

  # Perform signoff timing, then timing/DRV/power optimization with opt_signoff.
  # Should only be run at the very end, as runtime impact is significant.
  # Requires the same version of Tempus to be installed at ${cadence.cadence_home}/SSV/SSV${par.innovus.bin}/bin
  signoff: false

  # ---- eco_par: incremental place and route of a functional ECO ----
  # Post-route optimization after the ECO is placed and routed.
  # Valid options:
  # - full: whole-design opt_design -post_route -setup -hold (the original behavior; the fallback).
  # - targeted: post-ECO STA and electrical checks first, against the restored database. When the ECO
  #   broke setup or hold, the full mode's whole-design optimization, then one DRV pass for what it left;
  #   otherwise opt_design -post_route -drv only on the nets whose max_transition / max_capacitance
  #   violations the ECO introduced (not in the restored database) or worsened on an ECO-affected net,
  #   then setup / hold optimization only if those passes broke timing. See eco_lib.tcl beside this file.
  # - none: no optimization.
  # eco_check runs the same final verification after every mode (setup/hold timing, max_transition /
  # max_capacitance against the restored database, connectivity, DRC), and Conformal follows eco_par.
  eco_opt_mode: full
  # targeted: the most opt_design -drv passes. A pass after the first runs only when ECO-caused
  # violations remain (unresolved, or new ones the previous pass's own buffering or rerouting made),
  # and only when they differ from the set the previous pass already targeted.
  # type: int
  eco_opt_max_drv_passes: 2
  # Slack (ns) a timing or max_transition / max_capacitance number may lose against the restored
  # database before it counts as made worse by the ECO (targeted decisions and the final verification).
  # type: float
  eco_opt_slack_tolerance: 0.01
  # eco_place: place_eco -fix_placed_insts true, so every cell already placed keeps its location and
  # orientation (including cells a DRC repair mirrored). false: the stock place_eco, which may move or
  # re-orient existing cells to legalize the new ones.
  # type: bool
  eco_place_fix_existing: false
  # eco_par: fail the run when the final verification finds the ECO introduced violations (new or
  # worsened max_transition / max_capacitance pins, or setup / hold worse than the restored database).
  # false reports them (eco_verification.rpt and the log) without failing.
  # type: bool
  eco_fail_on_new_violations: false
  # eco_par: skip the checkpoints that duplicate another one (pre_eco_apply_patch is the database
  # eco_restore_design read; pre_write_regs and pre_write_design are pre_eco_check after read-only
  # checks). Each becomes a link to the database it duplicates, so --from_step still resumes at every step.
  # type: bool
  eco_dedupe_checkpoints: false
